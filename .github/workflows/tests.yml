name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Check environment
        env:
          DISCORD_WEBHOOK_URL: ""
        run: python -m dns_sentry --check-env

      - name: Run demo mode
        env:
          DISCORD_WEBHOOK_URL: ""
        run: python -m dns_sentry --demo
