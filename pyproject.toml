[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-sentry"
version = "0.1.0"
description = "Minimal DNS tunneling analysis core based on Shannon entropy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dns_sentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
